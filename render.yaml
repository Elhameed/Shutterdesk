# Render Blueprint — Shutterdesk API
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy, set CORS_ORIGIN to your Vercel URL(s), e.g.:
#   https://shutterdesk.vercel.app,https://shutterdesk-*.vercel.app
#
# DATABASE_URL is the Neon *pooled* string; DIRECT_DATABASE_URL is the
# *unpooled* one. Both are required — see the note on DIRECT_DATABASE_URL below.

services:
  - type: web
    name: shutterdesk-api
    runtime: node
    region: frankfurt
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Unpooled Neon string (no `-pooler` in the host). Used only by
      # `prisma migrate deploy`, which needs a session-scoped advisory lock
      # that transaction pooling cannot hold.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Prisma serialises `migrate deploy` with a session-scoped Postgres
      # advisory lock. Neon's pooled endpoint is PgBouncer in transaction mode
      # and cannot hold one; worse, an acquire that the client abandons there
      # can leave the lock held by an idle pooled backend, which then blocks
      # the direct connection too and wedges every later deploy.
      #
      # Deploys here are single-instance and sequential, so the lock buys
      # nothing. See https://pris.ly/d/migrate-advisory-locking
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER_PREFIX
        value: shutterdesk
      - key: SENTRY_DSN
        sync: false
